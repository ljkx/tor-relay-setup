<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="732" viewBox="0 0 1180 732" role="img" aria-label="Ubuntu 24.04 dry run: guided setup">
<title>Ubuntu 24.04 dry run: guided setup</title>
<rect width="100%" height="100%" rx="14" fill="#071923"/>
<rect width="100%" height="42" rx="14" fill="#0d2b38"/>
<circle cx="26" cy="21" r="7" fill="#ff5f57"/><circle cx="50" cy="21" r="7" fill="#ffbd2e"/><circle cx="74" cy="21" r="7" fill="#28c840"/>
<text x="104" y="27" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#a8d8e8">Ubuntu 24.04 dry run: guided setup</text>
<text x="28" y="64" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#23d6c8" xml:space="preserve">[04] +-- Relay Identity</text>
<text x="28" y="86" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | [INFO] Your nickname and ContactInfo will be public in Tor relay directories.</text>
<text x="28" y="108" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | Relay nickname (1-19 letters/numbers): <tspan fill="#ffb86c" font-weight="bold">ExampleRelay</tspan></text>
<text x="28" y="130" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | [INFO] ContactInfo is public. Tor expects a working email address; the CIISS v3 format also makes it machine-readable.</text>
<text x="28" y="152" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | ContactInfo format</text>
<text x="28" y="174" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] |   1)   Guided CIISS v3 string - email:you[]example.org ... ciissversion:3</text>
<text x="28" y="196" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] |   2)   Free-form text - Enter any contact string yourself</text>
<text x="28" y="218" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | Choose [1]: <tspan fill="#ffb86c" font-weight="bold">⏎</tspan></text>
<text x="28" y="240" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | Operator email address (published with @ written as []): <tspan fill="#ffb86c" font-weight="bold">ops@example.org</tspan></text>
<text x="28" y="262" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | Operator website (https://..., blank to skip): <tspan fill="#ffb86c" font-weight="bold">https://example.org</tspan></text>
<text x="28" y="284" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | Hosting provider domain, e.g. hetzner.com (blank to skip): <tspan fill="#ffb86c" font-weight="bold">⏎</tspan></text>
<text x="28" y="306" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#50fa7b" xml:space="preserve">[04] | [OK] ContactInfo: email:ops[]example.org url:https://example.org proof:uri-familyid-ed25519 ciissversion:3</text>
<text x="28" y="328" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#f1fa8c" xml:space="preserve">[04] | [WARN] Publish your relay FamilyId at https://example.org/.well-known/tor-relay/ed25519-family-id.txt so the url: field c</text>
<text x="28" y="350" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[04] | ORPort for incoming Tor connections [9001]: <tspan fill="#ffb86c" font-weight="bold">⏎</tspan></text>
<text x="28" y="372" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#23d6c8" xml:space="preserve">[05] +-- IPv6</text>
<text x="28" y="394" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[05] | [INFO] Tor encourages IPv6 on relays, but only when IPv6 connectivity actually works.</text>
<text x="28" y="416" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[05] | Configure an additional IPv6 ORPort? [y/N]: <tspan fill="#ffb86c" font-weight="bold">n</tspan></text>
<text x="28" y="438" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#23d6c8" xml:space="preserve">[06] +-- Relay Family</text>
<text x="28" y="460" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | [INFO] Relays run by the same operator must declare one family, so clients never use two of them in one circuit.</text>
<text x="28" y="482" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | [INFO] Since Tor 0.4.9 a family is a shared key (FamilyId). Every relay in the family gets a copy of the same key file.</text>
<text x="28" y="504" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | Relay family</text>
<text x="28" y="526" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] |   1)   This is my only relay - No family needed; add one later from the operator console</text>
<text x="28" y="548" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] |   2)   Create a new family key - First relay of a new family</text>
<text x="28" y="570" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] |   3)   Import an existing family key - Copy &lt;name&gt;.secret_family_key from one of your relays first</text>
<text x="28" y="592" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | Choose [1]: <tspan fill="#ffb86c" font-weight="bold">2</tspan></text>
<text x="28" y="614" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | Family key name [relay-family]: <tspan fill="#ffb86c" font-weight="bold">⏎</tspan></text>
<text x="28" y="636" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | [INFO] The key is generated with &#x27;tor --keygen-family&#x27; after Tor is installed.</text>
<text x="28" y="658" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | [INFO] Tor 0.4.8 is end-of-life, so current clients only need FamilyId. A legacy MyFamily list is optional.</text>
<text x="28" y="680" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">[06] | Also maintain a legacy MyFamily fingerprint list after setup? [y/N]: <tspan fill="#ffb86c" font-weight="bold">n</tspan></text>
</svg>
