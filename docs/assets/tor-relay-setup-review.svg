<title>Ubuntu 24.04 dry run: final review</title>
<rect width="100%" height="100%" rx="14" fill="#071923"/>
<rect width="100%" height="42" rx="14" fill="#0d2b38"/>
<circle cx="26" cy="21" r="7" fill="#ff5f57"/><circle cx="50" cy="21" r="7" fill="#ffbd2e"/><circle cx="74" cy="21" r="7" fill="#28c840"/>
<text x="104" y="27" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#a8d8e8">Ubuntu 24.04 dry run: final review</text>
<text x="28" y="64" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#23d6c8" xml:space="preserve">[09] +-- Review Before Applying</text>
<text x="28" y="86" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Target: Ubuntu 24.04.4 LTS (noble, amd64)</text>
<text x="28" y="108" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">System hostname: unchanged (relay-01)</text>
<text x="28" y="130" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Relay mode: Guard / middle</text>
<text x="28" y="152" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Relay: ExampleRelay on ORPort 9001</text>
<text x="28" y="174" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">ContactInfo: email:ops[]example.org url:https://example.org proof:uri-familyid-ed25519 ciissversion:3</text>
<text x="28" y="196" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">IPv6 ORPort: disabled</text>
<text x="28" y="218" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Relay family: new family key &quot;relay-family&quot; (FamilyId generated during apply)</text>
<text x="28" y="240" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Bandwidth: 1640 KBytes/s average, 8200 KBytes/s burst</text>
<text x="28" y="262" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Estimated average: ~13.4 Mbit/s, based on 4190 usable GBytes/month per relay direction</text>
<text x="28" y="284" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">AccountingMax: 8381 GBytes, monthly reset, AccountingRule sum</text>
<text x="28" y="306" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Traffic budget: 10TB raw, 10% headroom</text>
<text x="28" y="328" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Automatic updates: yes</text>
<text x="28" y="350" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Install Nyx: yes</text>
<text x="28" y="372" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">fzf interface: not installed; plain line mode</text>
<text x="28" y="394" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Firewall change: yes (ufw)</text>
<text x="28" y="416" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Enable UFW: yes, after allowing SSH TCP 22 and ORPort TCP 9001</text>
<text x="28" y="438" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">Tor Sandbox: yes</text>
<text x="28" y="460" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">MetricsPort: 127.0.0.1:9035 (local only)</text>
<text x="28" y="482" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">torrc preview:</text>
<text x="28" y="504" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Generated by setup-tor-guard-relay.sh on 2026-09-30 22:32:24 UTC.</text>
<text x="28" y="526" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Tor relay configuration.</text>
<text x="28" y="548" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Review Tor Project relay documentation before making manual changes.</text>
<text x="28" y="570" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="592" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    Nickname ExampleRelay</text>
<text x="28" y="614" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    ContactInfo &quot;email:ops[]example.org url:https://example.org proof:uri-familyid-ed25519 ciissversion:3&quot;</text>
<text x="28" y="636" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="658" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # FamilyId &lt;generated with tor --keygen-family during apply&gt;</text>
<text x="28" y="680" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="702" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    ORPort 9001</text>
<text x="28" y="724" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="746" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Disable local SOCKS listener on this relay-only server.</text>
<text x="28" y="768" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    SocksPort 0</text>
<text x="28" y="790" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="812" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Guard / middle relay mode.</text>
<text x="28" y="834" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    ExitRelay 0</text>
<text x="28" y="856" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="878" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Keep potentially sensitive log details scrubbed.</text>
<text x="28" y="900" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    SafeLogging 1</text>
<text x="28" y="922" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    Sandbox 1</text>
<text x="28" y="944" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="966" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Local-only Prometheus metrics. Never expose this port publicly.</text>
<text x="28" y="988" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    MetricsPort 127.0.0.1:9035</text>
<text x="28" y="1010" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    MetricsPortPolicy accept 127.0.0.1</text>
<text x="28" y="1032" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="1054" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Relay-specific bandwidth limits. Tor applies these per second.</text>
<text x="28" y="1076" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    RelayBandwidthRate 1640 KBytes</text>
<text x="28" y="1098" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    RelayBandwidthBurst 8200 KBytes</text>
<text x="28" y="1120" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    </text>
<text x="28" y="1142" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    # Monthly accounting safety cap. Tor hibernates if this is exhausted.</text>
<text x="28" y="1164" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    AccountingStart month 1 00:00</text>
<text x="28" y="1186" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    AccountingRule sum</text>
<text x="28" y="1208" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#d8edf3" xml:space="preserve">    AccountingMax 8381 GBytes</text>
</svg>
