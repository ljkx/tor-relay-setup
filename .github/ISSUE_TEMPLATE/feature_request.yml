name: Feature request
description: Suggest a relay-operator workflow or safety improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Which real relay-operator task would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: The interaction, defaults, and safety guardrails you expect. How should it look in the review screen and in `--dry-run`?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Tor Project documentation
      description: Link the official docs (or tor source) that back any change to relay behaviour.
  - type: dropdown
    id: risk
    attributes:
      label: Area
      options:
        - torrc generation
        - relay families (FamilyId / MyFamily)
        - exit relay behaviour
        - firewall / SSH access
        - package management / apt repository
        - monitoring (MetricsPort, Nyx)
        - cleanup
        - CI / tooling / releases
        - UI / docs only
        - other
