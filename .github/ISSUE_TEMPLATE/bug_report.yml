name: Bug report
description: Something in setup, the operator console, or cleanup behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through [private reporting](https://github.com/ljkx/tor-relay-setup/security/advisories/new), not here.**
        Remove private IPs, private emails, keys, and credentials before submitting.
  - type: input
    id: version
    attributes:
      label: Script version
      description: Output of `tor-relay-setup version`
      placeholder: "tor-relay-setup v3.0.0"
    validations:
      required: true
  - type: input
    id: tor-version
    attributes:
      label: tor version
      description: First line of `tor --version`, or "not installed"
      placeholder: "Tor version 0.4.9.13."
  - type: input
    id: system
    attributes:
      label: Distribution, codename, architecture
      placeholder: "Debian 13 trixie, arm64"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Setup wizard (guard/middle)
        - Setup wizard (exit)
        - apply --config
        - Operator console — relay family
        - Operator console — other action
        - status / status --json
        - Dry run
        - uninstall
        - Installation / release verification
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - full-screen interface
        - plain (--plain, or no terminal)
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and output
      description: Paste the relevant output. Each apply writes a full log to /var/log/tor-relay-setup/.
      render: text
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
      description: For example `tor-relay-setup status --json`, `tor --verify-config -f /etc/tor/torrc`, or `journalctl -u tor@default -n 50`.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy
      options:
        - label: I removed keys, credentials, and private server details from this report.
          required: true
