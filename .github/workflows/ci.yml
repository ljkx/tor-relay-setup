name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches Tor apt repository, key, or suite changes early.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: scripts/install-dev-tools.sh
      - name: Lint
        run: make lint

  test:
    name: Tests (host)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: scripts/install-dev-tools.sh
      - name: Unit, stubbed-system, and dry-run suites
        run: make test

  distro:
    name: ${{ matrix.image }} (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }})
    needs: [lint, test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        image:
          - debian:bookworm
          - debian:trixie
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute
        include:
          - runner: ubuntu-24.04-arm
            image: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        if: runner.arch == 'X64'
        run: scripts/install-dev-tools.sh
      - name: Dry-run flow inside the container
        if: runner.arch == 'X64'
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src" -w /src "$IMAGE" .tools/bin/bats tests/e2e.bats
      - name: Real Tor apt setup and tor --verify-config
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" -w /src "$IMAGE" tests/integration/tor-repo.sh

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
