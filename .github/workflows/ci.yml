name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches Tor apt repository, key, or suite changes early.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned toolchain
        run: scripts/install-dev-tools.sh
      - name: Lint
        run: make lint
      - name: go mod tidy is clean
        run: go mod tidy -diff

  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit and dry-run tests (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Known vulnerabilities
        run: make vuln

  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: make build && file bin/tor-relay-setup && ls -l bin/tor-relay-setup

  e2e:
    name: End-to-end dry runs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: apply --dry-run against a fresh fixture server
        run: |
          # shellcheck disable=SC1091
          source docs/demo/demo-env.sh fresh
          bin/tor-relay-setup apply --dry-run --yes --plain --config docs/examples/relay.toml | tee apply.log
          grep -F "Dry run complete" apply.log
          grep -F "tor --keygen-family" apply.log
      - name: apply refuses to overwrite an existing family key
        run: |
          # shellcheck disable=SC1091
          source docs/demo/demo-env.sh
          if bin/tor-relay-setup apply --dry-run --yes --plain --config docs/examples/relay.toml > conflict.log 2>&1; then
            echo "::error::apply should refuse to replace the fixture's family key"; exit 1
          fi
          grep -F "already exists" conflict.log
      - name: status --json against the fixture relay
        run: |
          # shellcheck disable=SC1091
          source docs/demo/demo-env.sh
          bin/tor-relay-setup status --dry-run --json > status.json || true
          jq -e '.relay.nickname == "ExampleRelay" and .reachability.ipv4 == true and .family.missing_keys == null' status.json

  vm:
    name: Real install (Ubuntu 24.04 VM)
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: Relay configuration
        run: |
          cat > ci-relay.toml << 'EOF'
          [relay]
          nickname = "CiRelay"
          contact = "email:ci[]example.org ciissversion:3"
          or_port = 9001
          mode = "guard"
          sandbox = true
          metrics_port = true

          [family]
          mode = "generate"
          key_name = "ci-family"

          [bandwidth]
          mode = "steady"
          monthly_quota = "10TB"
          headroom_percent = 10
          billing = "sum"

          [system]
          unattended_upgrades = true
          nyx = true
          firewall = "auto"
          enable_ufw = true
          EOF
      - name: apply on a real systemd host
        run: sudo bin/tor-relay-setup apply --config ci-relay.toml --yes --plain
      - name: The relay runs as configured
        run: |
          for _ in $(seq 1 30); do
            sudo bin/tor-relay-setup status --json > status.json || true
            jq -e '.listener.ipv4' status.json > /dev/null && break
            sleep 2
          done
          jq . status.json
          jq -e '.service.active and .tor.supported and .listener.ipv4
            and .relay.nickname == "CiRelay" and .relay.sandbox
            and (.family.ids | length) == 1 and .family.missing_keys == null' status.json
          sudo ufw status | grep -E '^9001/tcp +ALLOW'
          curl -fsS http://127.0.0.1:9035/metrics | grep -F 'tor_relay_traffic_bytes{direction="read"}'
          systemctl is-enabled unattended-upgrades
      - name: Applying again keeps the relay and its family
        run: |
          id=$(jq -r '.family.ids[0]' status.json)
          sed -e 's/^mode = "generate"/mode = "none"/' -e "/^key_name/c keep_ids = [\"${id}\"]" ci-relay.toml > again.toml
          sudo bin/tor-relay-setup apply --config again.toml --yes --plain
          sudo grep -Fx "FamilyId ${id}" /etc/tor/torrc
          systemctl is-active tor@default
      - name: A second relay on the same server
        run: |
          sed -e 's/^nickname = "CiRelay"/nickname = "CiRelay2"\ninstance = "relay2"/' \
            -e 's/^or_port = 9001/or_port = 9002/' ci-relay.toml > second.toml
          sudo bin/tor-relay-setup apply --config second.toml --yes --plain
          systemctl is-active tor@relay2
          sudo ufw status | grep -E '^9002/tcp +ALLOW'
          for _ in $(seq 1 30); do
            sudo bin/tor-relay-setup status --all --json > all.json || true
            jq -e 'all(.[]; .listener.ipv4)' all.json > /dev/null && break
            sleep 2
          done
          jq . all.json
          jq -e 'length == 2 and all(.[]; .service.active and .family.missing_keys == null)
            and (map(.instance) | sort) == ["default", "relay2"]
            and (map(.family.ids) | unique | length) == 1' all.json
          curl -fsS http://127.0.0.1:9036/metrics | grep -F 'tor_relay_traffic_bytes{direction="read"}'
      - name: fleet-probe reports both relays
        run: sudo bin/tor-relay-setup fleet-probe | jq -e '(.relays | length) == 2 and all(.relays[]; .traffic != null)'
      - name: status --format prometheus
        run: |
          sudo bin/tor-relay-setup status --all --format prometheus | tee metrics.prom
          grep -Fx 'tor_relay_setup_service_active{tor_instance="default"} 1' metrics.prom
          grep -Fx 'tor_relay_setup_service_active{tor_instance="relay2"} 1' metrics.prom
      - name: alert notices a stopped relay, also from its hardened systemd unit
        run: |
          sudo install -d -m 0700 /etc/tor-relay-setup
          printf '%s\n' 'min_severity = "info"' '[[command]]' 'argv = ["/bin/sh", "-c", "cat >> /var/lib/tor-relay-setup/alerts.jsonl"]' \
            | sudo install -m 0600 /dev/stdin /etc/tor-relay-setup/alerts.toml
          sudo bin/tor-relay-setup alert test
          sudo bin/tor-relay-setup alert run
          sudo systemctl stop tor@relay2
          sudo bin/tor-relay-setup alert run
          sudo cat /var/lib/tor-relay-setup/alerts.jsonl
          sudo grep -q relay2 /var/lib/tor-relay-setup/alerts.jsonl
          sudo systemctl start tor@relay2
          sudo bin/tor-relay-setup alert install --every 1m
          systemctl is-enabled tor-relay-setup-alert.timer
          sudo systemctl start tor-relay-setup-alert.service
          systemctl show -p Result --value tor-relay-setup-alert.service | grep -Fx success
      - name: fleet authorize lets a monitoring key run the probe and nothing else
        run: |
          # authorize refuses a binary that a non-root user could replace, and
          # the runner image leaves /usr/local/bin world-writable (mode 777):
          # give it the permissions a real server has.
          sudo chmod 0755 /usr/local /usr/local/bin
          sudo install -m 0755 bin/tor-relay-setup /usr/local/bin/tor-relay-setup
          sudo systemctl start ssh || sudo systemctl start sshd
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/monitor"
          sudo /usr/local/bin/tor-relay-setup fleet authorize --yes --from 127.0.0.1 --key "$(cat "$RUNNER_TEMP/monitor.pub")"
          probe() {
            ssh -i "$RUNNER_TEMP/monitor" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              tor-relay-probe@127.0.0.1 "$@"
          }
          probe > probe.json
          jq -e '(.relays | length) == 2 and all(.relays[]; .report.service.active)' probe.json
          # The forced command ignores what the client asks for.
          probe 'id; touch /tmp/pwned' > forced.json
          jq -e '.relays | length == 2' forced.json
          test ! -e /tmp/pwned
          # Ubuntu 26.04 uses sudo-rs, which rejects some classic sudo
          # settings: its visudo must accept the rule too.
          sudo cat /etc/sudoers.d/tor-relay-setup-probe > "$RUNNER_TEMP/probe.sudoers"
          docker run --rm -v "$RUNNER_TEMP/probe.sudoers:/in:ro" ubuntu:resolute sh -ec '
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends sudo-rs > /dev/null
            install -m 0440 /in /tmp/probe
            visudo-rs -c -f /tmp/probe'
          # The probe user cannot run anything else as root.
          ! sudo -u tor-relay-probe sudo -n /usr/local/bin/tor-relay-setup status 2> /dev/null
          ! sudo -u tor-relay-probe sudo -n /bin/sh -c id 2> /dev/null
          sudo /usr/local/bin/tor-relay-setup fleet authorize --remove --yes
          ! probe 2> /dev/null
      - name: monitor install --dry-run on a management server
        run: sudo /usr/local/bin/tor-relay-setup monitor install --domain grafana.example.org --dry-run --yes | tail -40
      - name: uninstall removes the tool, never Tor
        run: |
          sudo bin/tor-relay-setup uninstall --yes --plain
          test ! -e /var/lib/tor-relay-setup && test ! -e bin/tor-relay-setup
          test ! -e /etc/systemd/system/tor-relay-setup-alert.timer
          systemctl is-active tor@default tor@relay2
          sudo test -s /var/lib/tor/keys/ci-family.secret_family_key
      - name: Tor log
        if: always()
        run: sudo journalctl -u tor@default -u tor@relay2 -u tor-relay-setup-alert --no-pager -n 120 || true

  apt-repo:
    name: apt repository build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, sign, and read a repository with a throw-away key
        run: |
          work=$(mktemp -d)
          export GNUPGHOME="${work}/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key 'CI <ci@example.invalid>' ed25519 sign 1d
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          for arch in amd64 arm64; do
            pkg="${work}/pkg-${arch}"
            mkdir -p "${pkg}/DEBIAN" "${pkg}/usr/bin" "${work}/debs"
            printf '#!/bin/sh\n' > "${pkg}/usr/bin/tor-relay-setup"
            printf 'Package: tor-relay-setup\nVersion: 0.0.1\nArchitecture: %s\nMaintainer: CI <ci@example.invalid>\nDescription: test\n' "$arch" > "${pkg}/DEBIAN/control"
            dpkg-deb -b "$pkg" "${work}/debs/tor-relay-setup_0.0.1_${arch}.deb"
          done
          scripts/build-apt-repo.sh "${work}/debs" "${work}/site" "$fpr"
          mkdir -p "${work}/state/lists/partial" "${work}/cache/archives/partial"
          echo "deb [signed-by=${work}/site/tor-relay-setup.asc] file://${work}/site stable main" > "${work}/sources.list"
          chmod -R a+rX "$work"
          apt=(-o "Dir::State=${work}/state" -o "Dir::Cache=${work}/cache" -o "Dir::Etc::SourceList=${work}/sources.list" -o Dir::Etc::SourceParts=-)
          apt-get "${apt[@]}" -o APT::Update::Error-Mode=any update
          apt-cache "${apt[@]}" policy tor-relay-setup | grep -F 'Candidate: 0.0.1'

  installer:
    name: install.sh (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [debian:trixie, ubuntu:noble]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the newest release with this install.sh
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" "$IMAGE" bash -euc '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl > /dev/null
            bash /install.sh
            tor-relay-setup version
            if TOR_RELAY_SETUP_VERSION=not-a-version bash /install.sh 2> /dev/null; then
              echo "install.sh accepted a bogus version"; exit 1
            fi
          '

  integration:
    name: ${{ matrix.image }} (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }})
    needs: [test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        image:
          - debian:bookworm
          - debian:trixie
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute
        include:
          - runner: ubuntu-24.04-arm
            image: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build integration test binary
        run: CGO_ENABLED=0 go test -c -tags integration -o itest ./internal/integration
      - name: Real Tor apt setup, keygen and verify-config in the container
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD/itest:/itest:ro" "$IMAGE" /itest -test.v

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
