name: Demo

# Re-records the README demos (docs/assets/setup.gif, console.gif) from the
# tapes in docs/demo/, so UI changes can be reviewed as an artifact before
# the GIFs are committed.

on:
  pull_request:
    paths:
      - cmd/**
      - internal/tui/**
      - docs/demo/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record demos
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the binary
        run: |
          make build
          echo "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"

      - name: Record the setup wizard
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
          path: docs/demo/setup.tape
          install-fonts: true

      - name: Record the operator console
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
          path: docs/demo/console.tape

      - name: Upload recordings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gifs
          path: docs/assets/*.gif
          if-no-files-found: error
