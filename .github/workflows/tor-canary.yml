name: Tor canary

# Runs the container integration test against the Tor Project's nightly and
# experimental packages, so a Tor change that breaks setup (torrc options,
# family keys, package layout) shows up before it reaches the stable suite.
# Failures here are early warnings, not release blockers.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/tor-canary.yml
      - internal/integration/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            suite: tor-nightly-main-trixie
          - image: debian:trixie
            suite: tor-experimental-trixie
          - image: ubuntu:noble
            suite: tor-nightly-main-noble
    steps:
      # The experimental suite is empty between alpha cycles; apt would then
      # pick Debian's tor, which the origin check rightly refuses.
      - name: Does ${{ matrix.suite }} publish tor?
        id: suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          url="https://deb.torproject.org/torproject.org/dists/${SUITE}/main/binary-amd64/Packages.gz"
          version=$(curl -fsSL --retry 3 "$url" | gunzip | awk '$0 == "Package: tor" { p = 1 } p && /^Version:/ { print $2; exit }')
          if [[ -z "$version" ]]; then
            echo "::notice::${SUITE} publishes no tor package right now; nothing to test"
            exit 0
          fi
          echo "tor ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "publishes=true" >> "$GITHUB_OUTPUT"
      - if: steps.suite.outputs.publishes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.suite.outputs.publishes
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build integration test binary
        if: steps.suite.outputs.publishes
        run: CGO_ENABLED=0 go test -c -tags integration -o itest ./internal/integration
      - name: Setup with Tor from ${{ matrix.suite }}
        if: steps.suite.outputs.publishes
        env:
          IMAGE: ${{ matrix.image }}
          SUITE: ${{ matrix.suite }}
        run: docker run --rm -e TOR_SUITE="$SUITE" -v "$PWD/itest:/itest:ro" "$IMAGE" /itest -test.v
