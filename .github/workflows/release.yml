name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore signing for attestations
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches script version and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' setup-tor-guard-relay.sh)
          if [[ "v${version}" != "$TAG" ]]; then
            echo "::error::Tag ${TAG} does not match VERSION=${version} in setup-tor-guard-relay.sh"
            exit 1
          fi
          awk -v tag="$TAG" '
            $1 == "##" && $2 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [[ ! -s "${RUNNER_TEMP}/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no '## ${TAG}' section"
            exit 1
          fi

      - name: Build release assets
        run: make dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/setup-tor-guard-relay.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/setup-tor-guard-relay.sh dist/SHA256SUMS \
            --verify-tag \
            --title "Tor Relay Setup ${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${prerelease[@]}"
